[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "efiidite-schemadrift"
version = "0.1.0"
description = "收集同一接口的多条输出，检测哪些字段的出现率、类型或嵌套深度在版本间发生了漂移"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "efiidite" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://efiidite.github.io"
Repository = "https://github.com/efiidite/schemadrift"
Issues = "https://github.com/efiidite/schemadrift/issues"

[project.scripts]
schemadrift = "schemadrift:main"

[tool.setuptools]
py-modules = ["schemadrift"]
